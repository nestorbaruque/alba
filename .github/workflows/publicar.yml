# Compila los instaladores para Mac, Windows y Linux y los publica en Releases.
# Se lanza al subir una etiqueta tipo v1.0.0 (o a mano desde la pestaña Actions).
name: Publicar
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: macos-latest
            args: --target universal-apple-darwin
          - plataforma: windows-latest
            args: ""
          - plataforma: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Dependencias de Linux
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "alba __VERSION__"
          releaseBody: "Descarga abajo, en Assets, el archivo de tu ordenador. ¿Tienes Mac? Sigue estos pasos para abrirla la primera vez: https://github.com/${{ github.repository }}#instalar-en-mac-paso-a-paso"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
